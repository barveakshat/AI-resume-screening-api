services:
  - type: web
    name: resume-screening-api
    runtime: docker
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: resume-screening-db
          property: connectionString
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          type: keyvalue
          name: resume-screening-redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          type: keyvalue
          name: resume-screening-redis
          property: port
      - key: SPRING_DATA_REDIS_SSL_ENABLED
        value: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions
      - key: OPENAI_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION
        value: 604800000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: SWAGGER_ENABLED
        value: false

  - type: keyvalue
    name: resume-screening-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: resume-screening-db
    databaseName: resume_screening
    user: resume_screening
    plan: basic-256mb
